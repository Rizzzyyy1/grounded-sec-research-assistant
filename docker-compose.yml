# FinSight: UI -> API -> Qdrant server (+ the local data volume).
#
#   docker compose config                # validate + print the resolved config
#   docker compose up --build            # start everything
#   docker compose run --rm api finsight ingest    # download filings + XBRL facts
#   docker compose run --rm api finsight process   # parse + chunk
#   docker compose run --rm api finsight index     # embed into the Qdrant server (slow on CPU)
#
# Set FINSIGHT_SEC__USER_AGENT and (optionally) ANTHROPIC_API_KEY or FINSIGHT_LLM_PROVIDER=ollama
# in .env - see .env.example. For the free Ollama path, Ollama must run on the HOST (not in this
# compose stack) and the api container needs FINSIGHT_OLLAMA__BASE_URL=http://host.docker.internal:11434
# (Docker Desktop's name for the host - confirmed working: `docker exec finsight-api-1 python -c
# "import urllib.request as u; print(u.urlopen('http://host.docker.internal:11434/api/version').read())"`).
#
# Host ports default to 8000 (api) / 6333 (qdrant) / 8501 (ui) and can be moved with
# FINSIGHT_API_PORT / FINSIGHT_QDRANT_PORT / FINSIGHT_UI_PORT in .env if something else on the
# host already holds one of them (verified: `docker compose up` fails fast with "port is already
# allocated" rather than silently picking another port - set the *_PORT var and retry).
name: finsight

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:${FINSIGHT_QDRANT_PORT:-6333}:6333"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      FINSIGHT_QDRANT_URL: http://qdrant:6333
      FINSIGHT_LOG_JSON: "true"
      FINSIGHT_ENV: prod
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      - qdrant
    ports:
      - "127.0.0.1:${FINSIGHT_API_PORT:-8000}:8000"

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ui
    restart: unless-stopped
    environment:
      FINSIGHT_API_URL: http://api:8000
    volumes:
      - ./reports:/app/reports:ro
    depends_on:
      - api
    ports:
      - "127.0.0.1:${FINSIGHT_UI_PORT:-8501}:8501"

volumes:
  qdrant_data:
